<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Kraft paper subtle gradient -->
    <linearGradient id="kraftFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6af7e" />
      <stop offset="100%" stop-color="#bf9462" />
    </linearGradient>
    <linearGradient id="kraftPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa06e" />
      <stop offset="100%" stop-color="#b48754" />
    </linearGradient>
    <radialGradient id="sealGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fae3dc" />
      <stop offset="45%" stop-color="#e8c2b7" />
      <stop offset="90%" stop-color="#cca094" />
      <stop offset="100%" stop-color="#ae7f73" />
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#4a251b" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.12" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#be9361" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#b78c59" />
  <polygon points="59,15 59,53 36,34" fill="#b18552" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#kraftPocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="#a67744" stroke-width="0.75" opacity="0.4" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#kraftFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="#e8c79b" stroke-width="0.8" opacity="0.8" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="#9a6e3d" stroke-width="0.6" opacity="0.5" />

  <!-- Mini Corner Floral Sprays -->
  <!-- Top Right Floral Bouquet -->
  <circle cx="53" cy="11" r="3.2" fill="#f7b5a8" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#f09687" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#7ea672" />
  <circle cx="57" cy="9" r="1.6" fill="#8cb380" />
  <!-- Bottom Left Floral Bouquet -->
  <circle cx="11" cy="53" r="3.2" fill="#f7b5a8" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#f09687" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#7ea672" />

  <!-- Rose-Gold Wax Seal Stamp in Center -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="9.5" fill="url(#sealGrad)" />
    <!-- Embossed Inner Rim -->
    <circle cx="32" cy="38" r="7.8" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.75" />
    <circle cx="32" cy="38" r="7" fill="none" stroke="#b88377" stroke-width="0.5" opacity="0.6" />
    <!-- Centered Calligraphic/Serif Initial V -->
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">V</text>
  </g>
</svg>
