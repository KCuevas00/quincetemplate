<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <radialGradient id="sepiaGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3d2822" />
      <stop offset="60%" stop-color="#1e1315" />
      <stop offset="100%" stop-color="#0e080b" />
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef5d8"/>
      <stop offset="50%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#9a6e22"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#sepiaGlow)"/>

  <!-- Ornate inner frame -->
  <rect x="35" y="35" width="530" height="680" rx="16" fill="none" stroke="url(#goldFrame)" stroke-width="2" stroke-dasharray="8, 4" opacity="0.6"/>
  <rect x="50" y="50" width="500" height="650" rx="12" fill="none" stroke="url(#goldFrame)" stroke-width="1" opacity="0.4"/>

  <!-- Soft childhood remembrance illustration -->
  <g transform="translate(300, 360)">
    <!-- Light halo -->
    <circle cx="0" cy="-60" r="140" fill="#dfb15b" opacity="0.1" filter="url(#softGlow)"/>
    
    <!-- Little girl silhouette (age 5-6) in a cute birthday dress -->
    <!-- Dress -->
    <path d="M -50,110 Q -90,210 -110,280 L 110,280 Q 90,210 50,110 Z" fill="#b06c7e"/>
    <path d="M -35,115 Q -70,210 -85,280 L 85,280 Q 70,210 35,115 Z" fill="#ffd1dc" opacity="0.3"/>
    
    <!-- Arms -->
    <path d="M -50,110 Q -80,140 -90,170 Q -80,185 -65,165 L -40,125 Z" fill="#e8bca5"/>
    <path d="M 50,110 Q 80,140 90,170 Q 80,185 65,165 L 40,125 Z" fill="#e8bca5"/>

    <!-- Teddy bear / birthday gift held in hand -->
    <circle cx="-85" cy="180" r="22" fill="#7d4e32"/>
    <circle cx="-95" cy="165" r="8" fill="#5c3823"/>
    <circle cx="-75" cy="165" r="8" fill="#5c3823"/>
    <circle cx="-85" cy="185" r="10" fill="#a8714e"/>

    <!-- Head & Pigtails -->
    <circle cx="0" cy="30" r="46" fill="#e8bca5"/>
    <!-- Pigtails -->
    <circle cx="-42" cy="15" r="24" fill="#3a1e16"/>
    <circle cx="42" cy="15" r="24" fill="#3a1e16"/>
    <!-- Pink ribbons -->
    <circle cx="-36" cy="22" r="8" fill="#f07897"/>
    <circle cx="36" cy="22" r="8" fill="#f07897"/>
    <!-- Hair cap -->
    <path d="M -45,28 C -45,-30 45,-30 45,28 C 45,10 20,-10 0,-10 C -20,-10 -45,10 -45,28 Z" fill="#3a1e16"/>
    <!-- Smile -->
    <path d="M -12,48 Q 0,60 12,48" stroke="#c4586d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="-16" cy="36" r="3" fill="#3a1e16"/>
    <circle cx="16" cy="36" r="3" fill="#3a1e16"/>
  </g>

  <!-- Golden Stars & Balloons in memory -->
  <circle cx="140" cy="180" r="32" fill="#e6af9a" opacity="0.3" filter="url(#softGlow)"/>
  <path d="M 140,212 Q 135,270 145,310" stroke="#dfb15b" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <circle cx="460" cy="160" r="28" fill="#dfb15b" opacity="0.35" filter="url(#softGlow)"/>
  <path d="M 460,188 Q 465,250 450,295" stroke="#dfb15b" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Caption Plaque -->
  <g transform="translate(300, 640)" text-anchor="middle">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#180e14" stroke="url(#goldFrame)" stroke-width="1.5"/>
    <text y="-2" fill="#ffd1dc" font-family="'Cinzel', Georgia, serif" font-size="13" letter-spacing="2">MI NIÑEZ • 2015</text>
    <text y="15" fill="#e6af9a" font-family="'Montserrat', sans-serif" font-size="11" letter-spacing="1">Childhood Memory</text>
  </g>
</svg>
